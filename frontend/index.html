<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropSense — Smart Crop Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-art">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="wrapper">
        <header>
            <div class="logo">🌾 CropSense</div>
            <p class="tagline">Enter your soil & climate data to get an AI-powered crop recommendation</p>
        </header>

        <div class="card">
            <div class="section-label">Soil Nutrients</div>
            <div class="grid-3">
                <div class="field">
                    <label for="n">Nitrogen (N)</label>
                    <input type="number" id="n" placeholder="e.g. 90" min="0">
                    <span class="unit">kg/ha</span>
                </div>
                <div class="field">
                    <label for="p">Phosphorus (P)</label>
                    <input type="number" id="p" placeholder="e.g. 42" min="0">
                    <span class="unit">kg/ha</span>
                </div>
                <div class="field">
                    <label for="k">Potassium (K)</label>
                    <input type="number" id="k" placeholder="e.g. 43" min="0">
                    <span class="unit">kg/ha</span>
                </div>
            </div>

            <div class="section-label">Climate & Soil Conditions</div>
            <div class="grid-2">
                <div class="field">
                    <label for="temp">Temperature</label>
                    <input type="number" id="temp" placeholder="e.g. 21" step="0.1">
                    <span class="unit">°C</span>
                </div>
                <div class="field">
                    <label for="humidity">Humidity</label>
                    <input type="number" id="humidity" placeholder="e.g. 82" step="0.1">
                    <span class="unit">%</span>
                </div>
                <div class="field">
                    <label for="ph">Soil pH</label>
                    <input type="number" id="ph" placeholder="e.g. 6.5" step="0.1" min="0" max="14">
                    <span class="unit">pH</span>
                </div>
                <div class="field">
                    <label for="rainfall">Rainfall</label>
                    <input type="number" id="rainfall" placeholder="e.g. 200" step="0.1">
                    <span class="unit">mm</span>
                </div>
            </div>

            <button id="predict-btn" onclick="predict()">
                <span class="btn-text">Analyze & Recommend</span>
                <span class="btn-icon">→</span>
            </button>
        </div>

        <div class="result-card" id="result-card">
            <div class="result-inner">
                <div class="result-label">Recommended Crop</div>
                <div class="result-crop" id="result-crop">—</div>
                <div class="result-note" id="result-note"></div>
            </div>
        </div>

        <div class="error-msg" id="error-msg"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
